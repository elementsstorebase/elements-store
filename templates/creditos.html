{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <h2 class="text-2xl font-semibold text-gray-800">Control de Créditos a Clientes</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Otorgar crédito -->
        <div class="card">
            <h4 class="font-semibold text-gray-700 mb-3">Otorgar Nuevo Crédito</h4>
            <form id="form-credito" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Cliente</label>
                    <select id="cliente-credito" class="input-field" required>
                        <option value="">Seleccionar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Monto (USD)</label>
                    <input type="number" id="monto-credito" step="0.01" class="input-field" required>
                </div>
                <button type="submit" class="btn-primary">Otorgar Crédito</button>
            </form>
        </div>

        <!-- Registrar abono -->
        <div class="card">
            <h4 class="font-semibold text-gray-700 mb-3">Registrar Abono</h4>
            <form id="form-abono" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ID del Crédito</label>
                    <input type="number" id="credito-id" class="input-field" required placeholder="Número de crédito">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Monto del Abono</label>
                    <input type="number" id="monto-abono" step="0.01" class="input-field" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tasa de Cambio Aplicada</label>
                    <input type="number" id="tasa-abono" step="0.01" class="input-field" placeholder="Opcional, por defecto 1">
                </div>
                <button type="submit" class="btn-primary">Registrar Abono</button>
            </form>
        </div>
    </div>

    <!-- Listado de créditos activos (opcional) -->
    <div class="card">
        <h4 class="font-semibold text-gray-700 mb-3">Créditos Activos</h4>
        <p class="text-gray-400">Aquí se mostrarían los créditos pendientes (implementación pendiente).</p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/creditos.js') }}"></script>
{% endblock %}

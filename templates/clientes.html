{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Título y botón crear -->
    <div class="flex flex-wrap justify-between items-center gap-4">
        <div>
            <h2 class="text-2xl font-semibold text-gray-800">Clientes Fijos</h2>
            <p class="text-sm text-gray-400">Gestión de clientes de confianza para apartados</p>
        </div>
        <a href="/admin/clientes/crear" class="btn-primary flex items-center gap-2">
            <i class="fas fa-user-plus"></i> Nuevo Cliente
        </a>
    </div>

    <!-- Pestañas: Activos / Inactivos -->
    <div class="border-b border-gray-200">
        <nav class="-mb-px flex space-x-8" aria-label="Tabs">
            <button id="tab-activos" 
                    class="tab-btn border-indigo-500 text-indigo-600 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm"
                    onclick="cambiarPestana('activos')">
                <i class="fas fa-user-check mr-1"></i> Activos
            </button>
            <button id="tab-inactivos" 
                    class="tab-btn border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm"
                    onclick="cambiarPestana('inactivos')">
                <i class="fas fa-user-slash mr-1"></i> Inactivos
            </button>
        </nav>
    </div>

    <!-- Filtros y búsqueda -->
    <div class="card">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Buscar</label>
                <input type="text" id="filtro-buscar" class="input-field" placeholder="Nombre, cédula o teléfono...">
            </div>
            <div class="flex items-end space-x-2">
                <button id="btn-filtrar" class="btn-primary">🔍 Filtrar</button>
                <button id="btn-limpiar" class="btn-secondary">Limpiar</button>
            </div>
        </div>
    </div>

    <!-- Tabla de clientes -->
    <div class="card overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="text-left text-gray-400 border-b">
                    <th class="py-2 px-3">Nombre</th>
                    <th class="py-2 px-3">Apellido</th>
                    <th class="py-2 px-3">Cédula</th>
                    <th class="py-2 px-3">Teléfono</th>
                    <th class="py-2 px-3">Dirección</th>
                    <th class="py-2 px-3 text-center">Deudas Activas</th>
                    <th class="py-2 px-3 text-right">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-clientes">
                <tr><td colspan="7" class="text-center py-4 text-gray-400">Cargando clientes...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal de Acción (Desactivar / Reactivar) -->
<div id="modal-accion" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 id="modal-titulo" class="text-lg font-semibold text-gray-800">Confirmar Acción</h3>
            <button onclick="cerrarModalAccion()" class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <p id="modal-mensaje" class="text-gray-600 mb-4">¿Estás seguro de realizar esta acción?</p>
        <div class="flex space-x-3">
            <button id="modal-btn-confirmar" onclick="confirmarAccion()" class="btn-primary flex-1">
                <i id="modal-icono" class="fas fa-check mr-1"></i> Confirmar
            </button>
            <button onclick="cerrarModalAccion()" class="btn-secondary flex-1">Cancelar</button>
        </div>
        <input type="hidden" id="cliente-id-accion">
        <input type="hidden" id="tipo-accion">
        <input type="hidden" id="cliente-nombre-accion">
    </div>
</div>

<script src="{{ url_for('static', filename='js/clientes.js') }}"></script>
{% endblock %}

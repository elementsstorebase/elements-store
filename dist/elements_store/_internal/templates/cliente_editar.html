{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card">
        <div class="flex items-center gap-3 mb-6">
            <a href="/admin/clientes" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-arrow-left text-lg"></i>
            </a>
            <h3 class="text-xl font-semibold text-gray-800">Editar Cliente Fijo</h3>
        </div>

        <form id="form-cliente-editar" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- ID oculto -->
            <input type="hidden" id="cliente-id" value="{{ cliente.id }}">

            <!-- Nombre -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Nombre <span class="text-red-500">*</span></label>
                <input type="text" id="cliente-nombre" class="input-field" value="{{ cliente.nombre }}" required>
            </div>

            <!-- Apellido -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Apellido <span class="text-red-500">*</span></label>
                <input type="text" id="cliente-apellido" class="input-field" value="{{ cliente.apellido }}" required>
            </div>

            <!-- Cédula -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Cédula / RIF <span class="text-red-500">*</span></label>
                <input type="text" id="cliente-cedula" class="input-field" value="{{ cliente.cedula }}" required>
            </div>

            <!-- Teléfono -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Teléfono</label>
                <input type="text" id="cliente-telefono" class="input-field" value="{{ cliente.telefono or '' }}">
            </div>

            <!-- Dirección (ocupa 2 columnas) -->
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700">Dirección</label>
                <input type="text" id="cliente-direccion" class="input-field" value="{{ cliente.direccion or '' }}">
            </div>

            <!-- Botones -->
            <div class="md:col-span-2 flex space-x-3 mt-4">
                <button type="submit" class="btn-primary flex-1">
                    <i class="fas fa-save mr-1"></i> Actualizar Cliente
                </button>
                <a href="/admin/clientes" class="btn-secondary flex-1 text-center">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/clientes.js') }}"></script>
<script>
    // Lógica específica para edición de cliente
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('form-cliente-editar');
        const clienteId = document.getElementById('cliente-id').value;

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {
                nombre: document.getElementById('cliente-nombre').value.trim(),
                apellido: document.getElementById('cliente-apellido').value.trim(),
                cedula: document.getElementById('cliente-cedula').value.trim(),
                telefono: document.getElementById('cliente-telefono').value.trim(),
                direccion: document.getElementById('cliente-direccion').value.trim(),
                es_fijo: true
            };

            if (!data.nombre || !data.apellido || !data.cedula) {
                alert('❌ Nombre, apellido y cédula son obligatorios');
                return;
            }

            fetch(`/api/clientes/${clienteId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => {
                if (!r.ok) throw new Error('Error al actualizar cliente');
                return r.json();
            })
            .then(res => {
                alert(res.mensaje || '✅ Cliente actualizado correctamente');
                window.location.href = '/admin/clientes';
            })
            .catch(err => {
                alert('❌ Error: ' + err.message);
            });
        });
    });
</script>
{% endblock %}
